{{- if and .Values.annotationDiscovery.enabled .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pr-generator.fullname" . }}-annotation-discovery
  labels:
    {{- include "pr-generator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pr-generator.fullname" . }}-annotation-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "pr-generator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
